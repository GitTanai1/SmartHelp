server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browser hardening that does not depend on a particular deployment API URL.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header X-Frame-Options "DENY" always;

    # index.html points at hashed bundles and must be revalidated after deploy.
    location = /index.html {
        expires -1;
    }

    # Never return the SPA document for a missing JavaScript/CSS/font asset.
    location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
