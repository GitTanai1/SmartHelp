      <a class="navbar-brand fw-semibold" routerLink="/dashboard">
        <span class="brand-mark" aria-hidden="true">S</span>
        SmartHelp
      </a>

      <ul class="nav nav-pills gap-1 mb-0">
        <li class="nav-item">
          <a class="nav-link"
             routerLink="/dashboard"

            Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link"
             routerLink="/tickets"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: false }">
            Tickets
          </a>

        <li class="nav-item">
          <a class="nav-link"
             routerLink="/knowledge"
             routerLinkActive="active">

        </li>
      </ul>

  <!-- Page content -->
  <main class="container-fluid px-4 py-4">
