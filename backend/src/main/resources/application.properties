# SmartHelp backend configuration.
# Override any value with an environment variable of the same name.

spring.application.name=smarthelp-backend

# ── Server ──────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── Database ─────────────────────────────────────────────────────────────────
# MySQL connection. The HikariCP pool initialization-fail-timeout=0 lets the
# health endpoint respond even when MySQL is starting up. All JDBC endpoints
# still require a live MySQL connection.
spring.datasource.url=${SMARTHELP_DB_URL:jdbc:mysql://localhost:3306/smarthelp}
spring.datasource.username=${SMARTHELP_DB_USERNAME:smarthelp}
spring.datasource.password=${SMARTHELP_DB_PASSWORD:smarthelp}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=0

# ── Database initialisation ───────────────────────────────────────────────────
# Flyway is the only production schema authority. The old schema.sql/data.sql
# files are retained temporarily as development reference material, but are not
# executed by Spring Boot.
spring.sql.init.mode=never
spring.flyway.enabled=true
# Set SMARTHELP_FLYWAY_BASELINE_ON_MIGRATE=true exactly once when adopting an
# existing SmartHelp database that predates Flyway. Fresh databases must leave
# this false so V1 establishes the complete schema.
spring.flyway.baseline-on-migrate=${SMARTHELP_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1

# ── AI Service ───────────────────────────────────────────────────────────────
# Base URL of the Python FastAPI AI service. Used by AIService.java.
smarthelp.ai.base-url=${SMARTHELP_AI_BASE_URL:http://localhost:8000}
# Internal Java-to-Python authentication. Empty is allowed only in the local
# development profile; deployed environments set the required flag to true.
smarthelp.ai.shared-secret=${SMARTHELP_AGENT_SHARED_SECRET:}
smarthelp.ai.require-shared-secret=${SMARTHELP_AGENT_TOKEN_REQUIRED:false}

# Bounded capacity for long-lived workflow SSE requests. Requests beyond this
# capacity fail fast instead of consuming unbounded JVM threads.
smarthelp.agent.executor.max-threads=${SMARTHELP_AGENT_EXECUTOR_MAX_THREADS:8}
smarthelp.agent.executor.queue-capacity=${SMARTHELP_AGENT_EXECUTOR_QUEUE_CAPACITY:32}

# OIDC is intentionally opt-in for local development. Production must set this
# to true and provide SMARTHELP_OIDC_ISSUER_URI; the API then requires JWTs.
smarthelp.security.oidc-enabled=${SMARTHELP_OIDC_ENABLED:false}

# ── CORS ─────────────────────────────────────────────────────────────────────
# Allow the Angular dev server to call Spring Boot.
# In production, set this to the deployed frontend URL.
smarthelp.frontend.origin=${SMARTHELP_FRONTEND_ORIGIN:http://localhost:4200}

# Optional: comma-separated list of additional allowed origins (e.g. Vercel preview URLs)
smarthelp.extra.origins=${SMARTHELP_EXTRA_ORIGINS:}

# Operational probes and basic Micrometer metrics. Detailed health information
# remains hidden from unauthenticated callers.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=smarthelp

# RequestIdFilter places this correlation ID in SLF4J MDC. Include it in every
# console line so browser, Java, and agent-runtime evidence can be joined.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId}] %logger{39} - %msg%n
