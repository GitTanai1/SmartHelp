services:
  mysql:
    image: mysql:8.4
    container_name: smarthelp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smarthelp-root}
      MYSQL_DATABASE: ${SMARTHELP_DB_NAME:-smarthelp}
      MYSQL_USER: ${SMARTHELP_DB_USERNAME:-smarthelp}
      MYSQL_PASSWORD: ${SMARTHELP_DB_PASSWORD:-smarthelp}
    ports:
      - "${SMARTHELP_DB_PORT:-3306}:3306"
    volumes:
      - smarthelp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SMARTHELP_DB_URL: jdbc:mysql://mysql:3306/${SMARTHELP_DB_NAME:-smarthelp}
      SMARTHELP_DB_USERNAME: ${SMARTHELP_DB_USERNAME:-smarthelp}
      SMARTHELP_DB_PASSWORD: ${SMARTHELP_DB_PASSWORD:-smarthelp}
      SMARTHELP_AI_BASE_URL: http://ai-service:8000
      SMARTHELP_AGENT_SHARED_SECRET: ${SMARTHELP_AGENT_SHARED_SECRET:-}
      SMARTHELP_AGENT_TOKEN_REQUIRED: "false"
      SMARTHELP_FRONTEND_ORIGIN: http://localhost:4200
      SMARTHELP_OIDC_ENABLED: "false"
    ports:
      - "${SMARTHELP_BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ai-service:
    build:
      context: ./ai-service
    environment:
      SPRING_BOOT_BASE_URL: http://backend:8080
      SMARTHELP_AGENT_SHARED_SECRET: ${SMARTHELP_AGENT_SHARED_SECRET:-}
      SMARTHELP_AGENT_TOKEN_REQUIRED: "false"
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      SMARTHELP_CONFIDENCE_THRESHOLD: ${SMARTHELP_CONFIDENCE_THRESHOLD:-0.70}
      SMARTHELP_CHECKPOINT_DIR: /var/lib/smarthelp/checkpoints
    ports:
      - "${SMARTHELP_AI_PORT:-8000}:8000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - smarthelp-agent-checkpoints:/var/lib/smarthelp/checkpoints
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        ANGULAR_API_BASE_URL: http://localhost:${SMARTHELP_BACKEND_PORT:-8080}/api/v1
    ports:
      - "${SMARTHELP_FRONTEND_PORT:-4200}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  smarthelp-mysql-data:
  smarthelp-agent-checkpoints:
